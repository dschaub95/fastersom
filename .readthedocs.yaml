# https://docs.readthedocs.io/page/config-file/v2.html
version: 2
build:
  os: ubuntu-24.04
  tools:
    python: "3.14"
    nodejs: latest
  jobs:
    create_environment:
      - asdf plugin add uv
      - asdf install uv latest
      - asdf global uv latest
    build:
      html:
        # torch's CPU-only wheels: the docs do not need the CUDA libraries of the default Linux wheels
        - UV_TORCH_BACKEND=cpu uvx hatch run docs:build
        - mv docs/_build $READTHEDOCS_OUTPUT
