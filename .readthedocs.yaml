# https://docs.readthedocs.io/page/config-file/v2.html
version: 2
build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    # torch's CPU-only wheel instead of the default Linux wheel with its CUDA libraries, which the docs do not need
    pre_install:
      - pip install torch --index-url https://download.pytorch.org/whl/cpu
python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - doc
sphinx:
  configuration: docs/conf.py
  fail_on_warning: true
