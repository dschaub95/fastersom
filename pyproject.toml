[project]
name = "fastersom"
version = "0.1.1"
description = "Fast batch self-organising maps (SOM) in PyTorch for GPU and CPU"
readme = "README.md"
authors = [{ name = "Darius Schaub", email = "schaub.darius@gmail.com" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["self-organizing map", "som", "kohonen", "clustering", "pytorch", "gpu", "spatial omics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "torch>=2.3",  # first release built against NumPy 2
]

[project.urls]
Homepage = "https://github.com/dschaub95/fastersom"
Issues = "https://github.com/dschaub95/fastersom/issues"
Changelog = "https://github.com/dschaub95/fastersom/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "twine>=7.0.0",
]

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--import-mode=importlib"]
strict = true
filterwarnings = ["error"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "NPY", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["C408"]
